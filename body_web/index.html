<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>启明星 · Qimingxing MVP 1.0</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-alt: #19233d;
      --border: #263354;
      --text: #e6ecff;
      --muted: #8fa0c9;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --danger: #ef4444;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top right, #17213e 0%, var(--bg) 55%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 56px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(19, 26, 46, 0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
    }
    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
    }
    .conn-dot.connected { background: var(--ok); }
    .conn-dot.disconnected { background: var(--danger); }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    select, input, button {
      font-family: inherit;
    }
    .profile-select {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .ws-url-input {
      background: var(--panel-alt);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      width: 205px;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr 360px;
      min-height: 0;
    }
    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
      }
    }
    .avatar-panel {
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      background: rgba(19, 26, 46, 0.55);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .avatar-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 14px;
      text-align: center;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .avatar-face {
      font-size: 56px;
      line-height: 1.1;
      margin-bottom: 10px;
      user-select: none;
    }
    .emotion-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.2);
      color: #c7d2fe;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .activity-text {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .emotion-chip {
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      text-align: center;
    }
    .emotion-chip.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(99, 102, 241, 0.2);
    }
    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .error-banner {
      display: none;
      margin: 10px 20px 0;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
      font-size: 13px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .error-banner.visible { display: flex; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .composer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: rgba(19, 26, 46, 0.8);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .composer input[type="text"] {
      flex: 1;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .composer input[type="text"]:focus {
      border-color: var(--accent);
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
    .cards-panel {
      border-left: 1px solid var(--border);
      background: rgba(19, 26, 46, 0.55);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .cards-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cards-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .aux-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .aux-card.spoiler_steps {
      border-color: rgba(245, 158, 11, 0.5);
    }
    .aux-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .aux-card-title {
      font-weight: 600;
      font-size: 14px;
    }
    .aux-card-type {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.16);
      color: #c7d2fe;
      white-space: nowrap;
    }
    .aux-card-body {
      font-size: 13px;
      line-height: 1.55;
      color: #dbe4ff;
    }
    .aux-card-body.collapsed { display: none; }
    .aux-card-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12px;
    }
    .aux-card-body th, .aux-card-body td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      text-align: left;
    }
    .aux-card-body th { background: rgba(11, 16, 32, 0.55); }
    .aux-card-body code {
      background: rgba(11, 16, 32, 0.8);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .aux-card-body pre {
      background: rgba(11, 16, 32, 0.85);
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .aux-card-actions {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .empty-hint {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-top: 32px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🌟 启明星 · Qimingxing</span>
      <span class="conn-pill">
        <span id="connDot" class="conn-dot"></span>
        <span id="connText">连接中...</span>
      </span>
    </div>
    <div class="header-controls">
      <input id="wsUrlInput" class="ws-url-input" type="text" value="ws://127.0.0.1:18790/ws" aria-label="WebSocket URL" />
      <select id="profileSelect" class="profile-select" aria-label="模型配置"></select>
    </div>
  </header>

  <main>
    <aside class="avatar-panel">
      <div class="avatar-card">
        <div id="avatarFace" class="avatar-face">🙂</div>
        <div id="emotionBadge" class="emotion-badge">neutral</div>
        <div id="activityText" class="activity-text">状态：待机中 (idle)</div>
      </div>
      <div class="emotion-grid" id="emotionGrid"></div>
    </aside>

    <section class="chat-panel">
      <div id="errorBanner" class="error-banner">
        <span id="errorText"></span>
        <button id="dismissErrorBtn" class="btn-ghost" type="button">关闭</button>
      </div>
      <div id="messages" class="messages">
        <div class="empty-hint">发送问题给启明星试试看：<br/>• 普通对话：你好，介绍一下你自己<br/>• 防剧透卡片：给我 Boss 攻略提示（防剧透）<br/>• 感官联动：我当前的角色状态是什么？<br/>• 并发打断：输出一段 500 字长文</div>
      </div>
      <form id="chatForm" class="composer">
        <input id="chatInput" type="text" placeholder="输入消息给启明星（回车发送）..." autocomplete="off" />
        <button id="sendBtn" class="btn" type="submit">发送</button>
        <button id="stopBtn" class="btn btn-danger" type="button" disabled>停止</button>
      </form>
    </section>

    <aside class="cards-panel">
      <div class="cards-header">
        <span>📋 结构化辅助卡片</span>
        <button id="clearCardsBtn" class="btn-ghost" type="button">清空</button>
      </div>
      <div id="cardsList" class="cards-list">
        <div class="empty-hint">当回答包含表格、代码块或防剧透提示时，辅助卡片会独立渲染在这里。</div>
      </div>
    </aside>
  </main>

  <script>
    (() => {
      const PROTOCOL_VERSION = "1.0";
      const EMOTION_META = {
        neutral: { emoji: "🙂", label: "平静 neutral" },
        happy: { emoji: "😄", label: "开心 happy" },
        thinking: { emoji: "🤔", label: "思考 thinking" },
        surprised: { emoji: "😲", label: "惊讶 surprised" },
        confused: { emoji: "😕", label: "疑惑 confused" },
        warning: { emoji: "⚠️", label: "警示 warning" }
      };

      const connDot = document.getElementById("connDot");
      const connText = document.getElementById("connText");
      const wsUrlInput = document.getElementById("wsUrlInput");
      const profileSelect = document.getElementById("profileSelect");
      const avatarFace = document.getElementById("avatarFace");
      const emotionBadge = document.getElementById("emotionBadge");
      const activityText = document.getElementById("activityText");
      const emotionGrid = document.getElementById("emotionGrid");
      const errorBanner = document.getElementById("errorBanner");
      const errorText = document.getElementById("errorText");
      const dismissErrorBtn = document.getElementById("dismissErrorBtn");
      const messagesEl = document.getElementById("messages");
      const chatForm = document.getElementById("chatForm");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const stopBtn = document.getElementById("stopBtn");
      const cardsList = document.getElementById("cardsList");
      const clearCardsBtn = document.getElementById("clearCardsBtn");

      let ws = null;
      let reconnectAttempt = 0;
      let reconnectTimer = null;
      let pingTimer = null;
      let activeTurnId = null;
      let isGenerating = false;
      const bubbleByTurn = new Map();

      function initEmotionGrid() {
        emotionGrid.innerHTML = "";
        for (const [key, meta] of Object.entries(EMOTION_META)) {
          const el = document.createElement("div");
          el.className = "emotion-chip" + (key === "neutral" ? " active" : "");
          el.dataset.emotion = key;
          el.textContent = `${meta.emoji} ${key}`;
          emotionGrid.appendChild(el);
        }
      }

      function makeId(prefix = "evt") {
        const rand = Math.random().toString(16).slice(2, 10);
        return `${prefix}_${Date.now().toString(16)}_${rand}`;
      }

      function sendEnvelope(type, payload = {}, turnId = null) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return false;
        const env = {
          v: PROTOCOL_VERSION,
          id: makeId("evt"),
          ts: Date.now(),
          source: "body",
          type,
          payload
        };
        if (turnId) env.turn_id = turnId;
        ws.send(JSON.stringify(env));
        return true;
      }

      function setConnectionUI(state, detail) {
        connDot.className = "conn-dot " + state;
        connText.textContent = detail;
      }

      function updateAvatar(emotion, activity) {
        const safeEmotion = EMOTION_META[emotion] ? emotion : "neutral";
        const meta = EMOTION_META[safeEmotion];
        avatarFace.textContent = meta.emoji;
        emotionBadge.textContent = meta.label;
        activityText.textContent = `状态：${activity || "idle"}`;
        for (const chip of emotionGrid.querySelectorAll(".emotion-chip")) {
          chip.classList.toggle("active", chip.dataset.emotion === safeEmotion);
        }
      }

      function setGenerating(flag) {
        isGenerating = flag;
        stopBtn.disabled = !flag;
        chatInput.disabled = false;
        sendBtn.disabled = false;
      }

      function showError(msg) {
        errorText.textContent = msg;
        errorBanner.classList.add("visible");
      }

      function hideError() {
        errorBanner.classList.remove("visible");
      }

      function clearEmptyHint(container) {
        const hint = container.querySelector(".empty-hint");
        if (hint) hint.remove();
      }

      function appendUserBubble(text) {
        clearEmptyHint(messagesEl);
        const div = document.createElement("div");
        div.className = "bubble user";
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function ensureAssistantBubble(turnId, metaText = "启明星") {
        if (bubbleByTurn.has(turnId)) return bubbleByTurn.get(turnId);
        clearEmptyHint(messagesEl);
        const wrapper = document.createElement("div");
        wrapper.className = "bubble assistant";

        const meta = document.createElement("div");
        meta.className = "bubble-meta";
        meta.textContent = metaText;

        const content = document.createElement("div");
        content.textContent = "";

        wrapper.appendChild(meta);
        wrapper.appendChild(content);
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const record = { wrapper, meta, content };
        bubbleByTurn.set(turnId, record);
        return record;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderInlineMd(escaped) {
        return escaped
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      }

      function renderMarkdownSafe(md) {
        const lines = String(md || "").replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let inCode = false;
        let inList = false;
        let tableRows = [];

        const flushList = () => {
          if (inList) {
            html.push("</ul>");
            inList = false;
          }
        };
        const flushTable = () => {
          if (!tableRows.length) return;
          html.push("<table><thead><tr>");
          const headers = tableRows[0];
          for (const h of headers) html.push(`<th>${renderInlineMd(escapeHtml(h))}</th>`);
          html.push("</tr></thead><tbody>");
          for (let i = 1; i < tableRows.length; i++) {
            const row = tableRows[i];
            if (row.every((c) => /^:?-+:?$/.test(c.trim()))) continue;
            html.push("<tr>");
            for (const c of row) html.push(`<td>${renderInlineMd(escapeHtml(c))}</td>`);
            html.push("</tr>");
          }
          html.push("</tbody></table>");
          tableRows = [];
        };

        for (const line of lines) {
          if (line.trim().startsWith("```")) {
            flushList();
            flushTable();
            if (!inCode) {
              inCode = true;
              html.push("<pre><code>");
            } else {
              inCode = false;
              html.push("</code></pre>");
            }
            continue;
          }
          if (inCode) {
            html.push(escapeHtml(line) + "\n");
            continue;
          }
          if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
            flushList();
            const cells = line.trim().slice(1, -1).split("|").map((s) => s.trim());
            tableRows.push(cells);
            continue;
          } else {
            flushTable();
          }
          const headingMatch = line.match(/^(#{1,3})\s+(.*)$/);
          if (headingMatch) {
            flushList();
            const lvl = headingMatch[1].length + 2;
            html.push(`<h${lvl} style="margin:6px 0">${renderInlineMd(escapeHtml(headingMatch[2]))}</h${lvl}>`);
            continue;
          }
          if (/^[-*]\s+/.test(line.trim())) {
            if (!inList) {
              inList = true;
              html.push("<ul style='margin:6px 0;padding-left:18px'>");
            }
            html.push(`<li>${renderInlineMd(escapeHtml(line.trim().replace(/^[-*]\s+/, "")))}</li>`);
            continue;
          }
          flushList();
          if (line.trim()) {
            html.push(`<p style="margin:6px 0">${renderInlineMd(escapeHtml(line))}</p>`);
          }
        }
        flushList();
        flushTable();
        if (inCode) html.push("</code></pre>");
        return html.join("");
      }

      function renderCard(payload) {
        clearEmptyHint(cardsList);
        const cardEl = document.createElement("div");
        cardEl.className = "aux-card " + (payload.card_type || "markdown");
        cardEl.dataset.cardId = payload.card_id || "";

        const head = document.createElement("div");
        head.className = "aux-card-head";

        const title = document.createElement("div");
        title.className = "aux-card-title";
        title.textContent = payload.title || "辅助卡片";

        const typeBadge = document.createElement("span");
        typeBadge.className = "aux-card-type";
        typeBadge.textContent = payload.card_type || "markdown";

        head.appendChild(title);
        head.appendChild(typeBadge);

        const body = document.createElement("div");
        body.className = "aux-card-body";
        body.innerHTML = renderMarkdownSafe(payload.content_markdown || "");

        const actionsBar = document.createElement("div");
        actionsBar.className = "aux-card-actions";

        const actions = Array.isArray(payload.actions) && payload.actions.length
          ? payload.actions
          : [{ id: "dismiss", label: "知道了，收起" }];

        for (const act of actions) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-ghost";
          btn.textContent = act.label || act.id;
          btn.addEventListener("click", () => {
            if (act.id === "dismiss") {
              const collapsed = body.classList.toggle("collapsed");
              btn.textContent = collapsed ? "展开内容" : (act.label || "知道了，收起");
            } else {
              if (activeTurnId && isGenerating) cancelActiveTurn("new_action");
              const newTurn = makeId("turn");
              activeTurnId = newTurn;
              setGenerating(true);
              sendEnvelope("input.action", { action: act.id, card_id: payload.card_id }, newTurn);
            }
          });
          actionsBar.appendChild(btn);
        }

        cardEl.appendChild(head);
        cardEl.appendChild(body);
        cardEl.appendChild(actionsBar);
        cardsList.prepend(cardEl);
      }

      function handleWelcome(payload) {
        profileSelect.innerHTML = "";
        const profiles = Array.isArray(payload.profiles) ? payload.profiles : [];
        for (const p of profiles) {
          const opt = document.createElement("option");
          opt.value = p.name;
          opt.textContent = `${p.label || p.name} (${p.model || p.provider})`;
          if (p.name === payload.active_profile) opt.selected = true;
          profileSelect.appendChild(opt);
        }
      }

      function handleMessage(raw) {
        let env;
        try {
          env = JSON.parse(raw);
        } catch (err) {
          console.debug("Ignoring malformed JSON frame", err);
          return;
        }
        const type = env.type;
        const payload = env.payload || {};
        const turnId = env.turn_id || null;

        if (type === "system.welcome") {
          handleWelcome(payload);
          return;
        }
        if (type === "system.pong") {
          return;
        }
        if (type === "system.error") {
          showError(`[${payload.code || "ERROR"}] ${payload.message || "未知错误"}`);
          setGenerating(false);
          updateAvatar("warning", "idle");
          return;
        }

        // Strict turn_id filtering to prevent stale deltas after cancel
        if (turnId && activeTurnId && turnId !== activeTurnId) {
          console.debug("Dropping stale event for old turn_id:", turnId, type);
          return;
        }

        if (type === "output.turn_start") {
          hideError();
          setGenerating(true);
          if (turnId) {
            ensureAssistantBubble(turnId, `启明星 · ${payload.profile || ""} (${payload.model || ""})`);
          }
          return;
        }
        if (type === "avatar.state") {
          updateAvatar(payload.emotion, payload.activity);
          return;
        }
        if (type === "output.text_delta") {
          if (turnId && payload.delta) {
            const rec = ensureAssistantBubble(turnId);
            rec.content.textContent += payload.delta;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
          return;
        }
        if (type === "output.card") {
          renderCard(payload);
          return;
        }
        if (type === "output.turn_end") {
          setGenerating(false);
          if (payload.finish_reason === "cancelled" && turnId) {
            const rec = bubbleByTurn.get(turnId);
            if (rec) rec.meta.textContent += " · [已打断]";
          }
          return;
        }
        if (type === "output.tool_status") {
          activityText.textContent = `状态：${payload.label || payload.tool || "tool_running"}`;
          return;
        }

        // Forward compatibility: silently ignore unrecognized events
        console.debug("Ignoring unrecognized event type:", type, env);
      }

      function cancelActiveTurn(reason = "user_cancelled") {
        if (!activeTurnId) return;
        const cancellingTurn = activeTurnId;
        sendEnvelope("input.cancel", { reason }, cancellingTurn);
        const rec = bubbleByTurn.get(cancellingTurn);
        if (rec) rec.meta.textContent += " · [已打断]";
        activeTurnId = makeId("turn");
        setGenerating(false);
        updateAvatar("neutral", "idle");
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectAttempt += 1;
        const delayMs = Math.min(1000 * Math.pow(2, reconnectAttempt - 1), 5000);
        setConnectionUI("disconnected", `已断开，${(delayMs / 1000).toFixed(1)}s 后重连...`);
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, delayMs);
      }

      function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
          ws.close();
        }
        const url = wsUrlInput.value.trim() || "ws://127.0.0.1:18790/ws";
        setConnectionUI("", "连接中...");
        ws = new WebSocket(url);

        ws.onopen = () => {
          reconnectAttempt = 0;
          setConnectionUI("connected", "已连接 Brain");
          sendEnvelope("system.hello", {
            client_name: "simple-dialogue-box",
            role: "body",
            capabilities: {
              avatar_mode: "simple_2d",
              supported_emotions: Object.keys(EMOTION_META),
              streaming_text: true,
              ui_cards: ["markdown", "spoiler_steps"],
              audio_output: false,
              lip_sync: false
            }
          });
          if (pingTimer) clearInterval(pingTimer);
          pingTimer = setInterval(() => {
            sendEnvelope("system.ping", { client_ts: Date.now() });
          }, 15000);
        };

        ws.onmessage = (event) => handleMessage(event.data);

        ws.onerror = () => {
          setConnectionUI("disconnected", "连接异常");
        };

        ws.onclose = () => {
          if (pingTimer) {
            clearInterval(pingTimer);
            pingTimer = null;
          }
          setGenerating(false);
          scheduleReconnect();
        };
      }

      profileSelect.addEventListener("change", () => {
        if (profileSelect.value) {
          sendEnvelope("system.config_set", { profile: profileSelect.value });
        }
      });

      stopBtn.addEventListener("click", () => {
        cancelActiveTurn("stop_button");
      });

      dismissErrorBtn.addEventListener("click", hideError);

      clearCardsBtn.addEventListener("click", () => {
        cardsList.innerHTML = '<div class="empty-hint">已清空辅助卡片。</div>';
      });

      wsUrlInput.addEventListener("change", () => {
        reconnectAttempt = 0;
        connect();
      });

      chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          showError("尚未连接到 Brain WebSocket 服务，请等待自动重连。");
          return;
        }
        if (isGenerating && activeTurnId) {
          cancelActiveTurn("superseded_by_new_input");
        }
        chatInput.value = "";
        appendUserBubble(text);
        const turnId = makeId("turn");
        activeTurnId = turnId;
        setGenerating(true);
        sendEnvelope("input.text", { text }, turnId);
      });

      initEmotionGrid();
      connect();
    })();
  </script>
</body>
</html>
