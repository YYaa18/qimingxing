<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>启明星 · Qimingxing v1.0.1</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span>🌟 启明星 · Qimingxing</span>
      <span class="conn-pill">
        <span id="connDot" class="conn-dot"></span>
        <span id="connText">连接中...</span>
      </span>
    </div>
    <div class="header-controls">
      <div class="privacy-switcher" role="group" aria-label="桌面感知权限">
        <button class="privacy-btn" data-mode="off" type="button">关闭</button>
        <button class="privacy-btn active" data-mode="meta_only" type="button">仅窗口</button>
        <button class="privacy-btn" data-mode="full_on_demand" type="button">按需看屏</button>
      </div>
      <input id="wsUrlInput" class="ws-url-input" type="text" value="ws://127.0.0.1:18790/ws" aria-label="WebSocket URL" />
      <select id="profileSelect" class="profile-select" aria-label="模型配置"></select>
    </div>
  </header>

  <div class="context-bar">
    <div class="context-summary">
      <span id="sensesBadge" class="senses-badge offline">桌面感官未连接</span>
      <span id="windowSummary">未收到窗口上下文</span>
    </div>
    <div id="toolStatusBar" class="tool-status-bar">
      <span id="toolStepBadge" class="tool-step-badge">工具执行</span>
      <span id="toolStatusLabel">准备中…</span>
    </div>
    <button id="emergencyStopBtn" class="btn btn-emergency" type="button" hidden>🚨 紧急停止</button>
    <div id="captureIndicator" class="capture-indicator">
      <span>👁️</span>
      <span id="captureLabel">正在查看当前桌面…</span>
    </div>
  </div>

  <main>
    <aside class="avatar-panel">
      <div class="avatar-card">
        <div id="avatarFace" class="avatar-face">🙂</div>
        <div id="emotionBadge" class="emotion-badge">neutral</div>
        <div id="activityText" class="activity-text">状态：待机中 (idle)</div>
      </div>
      <div class="emotion-grid" id="emotionGrid"></div>
    </aside>

    <section class="chat-panel">
      <div id="permissionBanner" class="banner permission-banner">
        <span id="permissionText"></span>
      </div>
      <div id="usageAlertBanner" class="banner permission-banner">
        <span id="usageAlertText"></span>
        <button id="dismissUsageBtn" class="btn-ghost" type="button">知道了</button>
      </div>
      <div id="proactiveNoticeBanner" class="banner proactive-banner">
        <span id="proactiveNoticeText"></span>
        <button id="dismissNoticeBtn" class="btn-ghost" type="button">收到</button>
      </div>
      <div id="errorBanner" class="banner error-banner">
        <span id="errorText"></span>
        <button id="dismissErrorBtn" class="btn-ghost" type="button">关闭</button>
      </div>
      <div id="messages" class="messages"></div>
      <div id="attachmentBar" class="attachment-bar"></div>
      <form id="chatForm" class="composer">
        <input id="fileInput" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.md,.py,.js,.ts,.json,.yaml,.yml,.log,.csv,.sh,.sql,.html,.css,.xml" hidden />
        <button id="attachBtn" class="btn btn-secondary" type="button" title="上传截图、代码或 PDF 附件（也支持 Cmd+V 粘贴或拖拽）">📎</button>
        <input id="chatInput" type="text" placeholder="和启明星聊聊，或粘贴/拖拽截图、代码、PDF 直接提问（回车发送）..." autocomplete="off" />
        <button id="sendBtn" class="btn" type="submit">发送</button>
        <button id="askScreenBtn" class="btn btn-secondary" type="button">👁️ 附带屏幕提问</button>
        <button id="stopBtn" class="btn btn-danger" type="button" disabled>停止</button>
        <button id="clearChatBtn" class="btn-ghost" type="button">清空对话</button>
      </form>
    </section>

    <aside class="cards-panel">
      <div class="cards-header">
        <span>⚙️ 后台长任务</span>
        <button id="refreshTasksBtn" class="btn-ghost" type="button">刷新</button>
      </div>
      <div id="bgTasksList" class="bg-tasks-list">
        <div class="empty-hint">暂无后台长任务。</div>
      </div>
      <div class="cards-header">
        <span>📋 结构化辅助卡片</span>
        <button id="clearCardsBtn" class="btn-ghost" type="button">清空</button>
      </div>
      <div id="cardsList" class="cards-list">
        <div class="empty-hint">长篇代码、排查步骤或对比表格会自动沉降渲染在这里。</div>
      </div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
