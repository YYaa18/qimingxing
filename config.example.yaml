# 启明星 (Qimingxing) MVP 2.0 示例配置
# 复制为 config.yaml 并配置环境变量（如 DEEPSEEK_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY）。
# 密钥绝不会通过 WebSocket 发送给客户端。

server:
  host: "127.0.0.1"
  port: 18790

default_profile: "mock_local"

profiles:
  mock_local:
    label: "本地模拟模型 (无需 Key)"
    provider: "mock"
    model: "qimingxing-mock-v1"
    temperature: 0.3
    timeout_seconds: 30
    supports_vision: false

  deepseek_flash:
    label: "DeepSeek Flash (视觉直看)"
    provider: "openai_compatible"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-flash"
    api_key: "${DEEPSEEK_API_KEY}"
    temperature: 0.7
    timeout_seconds: 30
    supports_vision: true

  fast_deepseek:
    label: "DeepSeek Chat (纯文本 + OCR)"
    provider: "openai_compatible"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    api_key: "${DEEPSEEK_API_KEY}"
    temperature: 0.7
    timeout_seconds: 30
    supports_vision: false
    # 可按 Profile 覆盖 usage_ledger 估算单价（元 / 百万 Token）：
    # input_cny_per_1m: 2.0
    # cache_hit_cny_per_1m: 0.2
    # output_cny_per_1m: 8.0

  reasoner_deepseek:
    label: "DeepSeek Reasoner (深度推理)"
    provider: "openai_compatible"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-reasoner"
    api_key: "${DEEPSEEK_API_KEY}"
    temperature: 0.7
    timeout_seconds: 60
    supports_vision: false

  smart_openai:
    label: "OpenAI GPT-4o (强推理/视觉)"
    provider: "openai_compatible"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o"
    api_key: "${OPENAI_API_KEY}"
    temperature: 0.7
    timeout_seconds: 45
    supports_vision: true

  claude_sonnet:
    label: "Anthropic Claude 3.5 Sonnet"
    provider: "anthropic"
    base_url: "https://api.anthropic.com"
    model: "claude-3-5-sonnet-latest"
    api_key: "${ANTHROPIC_API_KEY}"
    temperature: 0.7
    timeout_seconds: 45
    supports_vision: true

ocr:
  provider: "deepseek_ocr"
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  mode: "text_recognition"
  timeout_seconds: 20

privacy:
  default_mode: "meta_only"
  blocked_apps:
    - "1Password"
    - "Bitwarden"
    - "KeePass"
    - "Keychain Access"
    - "钥匙串访问"
    - "微信"
    - "WeChat"
  blocked_title_keywords:
    - "Incognito"
    - "InPrivate"
    - "Private Browsing"
    - "无痕"
    - "网银"
    - "支付宝"
    - "Alipay"
    - "Bank"
    - "Password"
    - "密码"

memory:
  backend: "sqlite"  # 预留 "postgres" 容器级扩展槽位
  sqlite_path: "data/qimingxing_memory.db"
  hot_message_limit: 10000
  archive_batch_size: 2000
  extraction:
    enabled: true
    profile: "fast_deepseek"
    batch_turns: 4
    idle_seconds: 120
    persist_desktop_footprints: true
    # Rolling compression is independent from fact extraction.
    compress_enabled: true
    compress_batch_turns: 6
    compress_high_ratio: 1.0
    compress_low_ratio: 0.55
    compress_summary_max_chars: 1600
    compress_max_batches: 4
  embedding:
    provider: "null"  # 可改配 "openai_compatible" 接入 Ollama / 硅基流动 / OpenAI / 百炼
    base_url: "http://127.0.0.1:11434/v1"
    api_key_env: "EMBEDDING_API_KEY"
    model: "bge-m3"
    timeout_ms: 800

context_budget:
  # Input budget tiers: 16000 / 32000 / 64000 (balanced default 32000)
  input_tier_tokens: 32000
  request_max_tokens: 8192
  fallback_context_window: 64000

  # Floor + cap allocation
  l1_profile_floor_tokens: 600
  l1_profile_tokens: 1200
  l2_summary_floor_tokens: 1000
  l2_summary_tokens: 1500
  l2_recent_floor_tokens: 3000
  l2_recent_tokens: 6000

  l3_recall_tokens: 800
  l3_skills_tokens: 1000
  l3_attachments_tokens: 2000
  l3_desktop_ocr_tokens: 2000
  l3_total_ratio: 0.35

  # Legacy fallback only; resolved budgets are computed per model.
  total_max_tokens: 32000

tools:
  enabled: true
  max_tool_steps: 8
  approval_timeout_sec: 60
  web_search:
    enabled: true
    provider: "deepseek"  # 复用 DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    timeout_seconds: 15
    max_results: 5
    max_fetch_chars: 6000
  image_search:
    enabled: true
    provider: "tavily"
    base_url: "https://api.tavily.com"
    api_key: "${TAVILY_API_KEY}"
    timeout_seconds: 20
    max_results: 4
    max_bytes: 10485760
    safe_search: true
    cache_dir: "data/media/image_search"
  shell:
    enabled: true
    safe_commands:
      - "pwd"
      - "ls"
      - "git status"
      - "git log"
      - "git diff"
      - "which"
      - "whoami"
      - "uname"
      - "date"
      - "echo"
      - "head"
      - "tail"
      - "wc"
      - "cat"
    blocked_patterns:
      - "rm\\s+-[a-zA-Z]*r[a-zA-Z]*f?\\s+(/|\\*|~)"
      - "rm\\s+-[a-zA-Z]*f[a-zA-Z]*r\\s+(/|\\*|~)"
      - "\\bmkfs(\\.[a-z0-9]+)?\\b"
      - "\\bdd\\s+if="
      - "\\bsudo\\b"
      - "\\b(shutdown|reboot|halt|poweroff)\\b"
      - "\\bdiskutil\\s+(erase|partition|zeroDisk)"
      - "\\bprintenv\\b"
      - "config\\.yaml"
      - "\\.env\\b"
    timeout_sec: 30
    default_cwd: "~"
    max_output_chars: 4000
  skills:
    auto_learn: true
    max_recalled_skills: 2
    learn_profile: "fast_deepseek"
  usage_alert:
    enabled: true
    daily_warn_cny: 5.0
    turn_warn_tokens: 50000
    hard_block: false  # 仅做软额度提醒与查账，严禁硬性截断正在执行的任务

scheduler:
  enabled: true
  poll_interval_sec: 5.0
  summary_profile: "fast_deepseek"

# 标准 MCP Server 客户端挂载（支持 stdio / sse / streamable_http，第三方工具默认强制 CONFIRM 审批）
mcp_servers:
  # - name: "filesystem"
  #   enabled: true
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/qimingxing_sandbox"]
  #   safe_tools: ["list_directory", "read_text_file", "get_file_info"]
  #   timeout_sec: 30
  #   startup_timeout_sec: 15
  []

# 流式语音闭环配置（DeepSeek 官方 ASR / TTS + 全局按住说话热键）
audio:
  enabled: true
  asr:
    provider: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-asr"
    timeout_sec: 15
  tts:
    provider: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-tts"
    voice: "stella"  # 可选 stella（女声） / tide（男声）
    sample_rate: 24000
    filter_markdown: true
    timeout_sec: 20
  ptt:
    hotkey: "right_option"  # 支持 right_option / left_option / option+space / ctrl+space
    sample_rate: 16000
    max_record_sec: 60

# 批量路径引用挂载与桌面按需收件箱（仅传路径与目录树，绝不读取全文，零后台轮询）
batch_context:
  inbox_dir: "~/Desktop/给启明星"
  max_paths: 200
  max_tree_depth: 3

# Godot 4 桌面躯体联动偏好（可选插件）
godot:
  auto_hide_on_capture: true
  earcons_enabled: true
  ambient_duck_db: -12.0

# 原生壳 UI 共享状态（由 Brain 统一维护）
ui:
  avatar_enabled: false
  avatar_scale: 1.0
  roam: true
  earcons: true
  ambient: false

# 后台异步长任务引擎（asyncio 轻量任务池）
background_tasks:
  enabled: true
  max_concurrency: 2
  max_steps: 12
  timeout_sec: 300

