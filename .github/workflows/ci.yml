name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-timeout
      - name: Test
        run: python -m pytest -q --timeout=120
      - name: Metrics
        run: python scripts/metrics_report.py --json > metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

  swift-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: shell_macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release

  swift-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: shell_macos
    steps:
      - uses: actions/checkout@v4
      - run: swift test
